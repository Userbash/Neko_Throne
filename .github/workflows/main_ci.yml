# ═══════════════════════════════════════════════════════════════════════════════
# Neko Throne CI/CD — amd64 only (Linux + Windows)
# ═══════════════════════════════════════════════════════════════════════════════
name: Neko Throne CI/CD (amd64)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза и версия"
        required: false
        default: ""
      publish:
        description: "r — обычный релиз, p — предрелиз, пусто — не публиковать"
        required: false
  push:
    branches: ["**"]
    paths-ignore: ["**.md", LICENSE, "docs/**"]

env:
  QT_VERSION: "6.10.2"
  GO_VERSION: "1.26.0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Линтер Go ─────────────────────────────────────────────────────
  lint-go:
    name: 🔍 Линтер Go
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v6.0.2
        with: { submodules: recursive }
      - name: 🛠️ Установка Go
        uses: actions/setup-go@v6.3.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/server/go.sum
      - name: 🔧 Генерация protobuf кода
        run: |
          PROTOC_VER="31.1"
          curl -fLO --retry 3 "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VER}/protoc-${PROTOC_VER}-linux-x86_64.zip"
          unzip "protoc-${PROTOC_VER}-linux-x86_64.zip" -d /tmp/protoc_install
          sudo cp /tmp/protoc_install/bin/protoc /usr/local/bin/
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
          cd core/server/gen
          protoc -I . --go_out=. --go-grpc_out=. libcore.proto
      - name: 🔍 go vet
        working-directory: core/server
        run: go vet ./...

  # ─── Сборка (Go + C++) ────────────────────────────────────
  build:
    name: "🏗️ Build ${{ matrix.os_label }}"
    permissions: { contents: read }
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: ubuntu-latest,  os_label: linux,   cross_os: linux,   cross_arch: amd64, container: "ubuntu:24.04" }
          - { platform: windows-latest, os_label: windows, cross_os: windows, cross_arch: amd64, container: "" }
    runs-on: ${{ matrix.platform }}
    container: ${{ matrix.container }}
    env:
      DEBIAN_FRONTEND: noninteractive
      INPUT_VERSION: ${{ github.event.inputs.tag }}

    steps:
      - name: 📦 Подготовка контейнера (Linux)
        if: matrix.os_label == 'linux'
        run: |
          # Kill host env leaks
          unset pythonLocation PKG_CONFIG_PATH Python_ROOT_DIR Python2_ROOT_DIR Python3_ROOT_DIR LD_LIBRARY_PATH

          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            ca-certificates curl git unzip build-essential pkg-config \
            python3 python3-dev python3-venv python3-pip \
            ninja-build cmake libx11-dev libx11-xcb-dev libxcb-cursor-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libgl1-mesa-dev libdbus-1-dev libwayland-dev libxcb-icccm4-dev \
            libxcb-image0-dev libxcb-keysyms1-dev libxcb-randr0-dev libxcb-render-util0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxcb-xinerama0-dev libxcb-xkb-dev

          python3 -m venv /opt/qt-ci-venv
          /opt/qt-ci-venv/bin/python -m pip install --upgrade pip
          /opt/qt-ci-venv/bin/python -m pip install -r scripts/ci/requirements-qt.txt

          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/checkout@v6.0.2
        with: { submodules: recursive }

      - name: 📦 Кэш Go артефактов
        id: cache-go
        uses: actions/cache@v5.0.3
        with:
          path: go-artifacts.tgz
          key: go-${{ matrix.cross_os }}-${{ hashFiles('core/**', 'scripts/ci/build_go.sh') }}-${{ env.GO_VERSION }}

      - name: 🛠️ Установка Go
        if: steps.cache-go.outputs.cache-hit != 'true'
        uses: actions/setup-go@v6.3.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/server/go.sum

      - name: 🔨 Сборка Go бэкенда
        if: steps.cache-go.outputs.cache-hit != 'true'
        shell: bash
        env:
          GOOS: ${{ matrix.cross_os }}
          GOARCH: ${{ matrix.cross_arch }}
        run: |
          set -e
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            PROTOC_VER="31.1"
            curl -fLO --retry 5 "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VER}/protoc-${PROTOC_VER}-win64.zip"
            unzip -q "protoc-${PROTOC_VER}-win64.zip" -d protoc_install
            export PATH="$PWD/protoc_install/bin:$PATH"
            echo "$PWD/protoc_install/bin" >> "$GITHUB_PATH"
          else
            ./scripts/ci/setup_go.sh
          fi
          
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
          
          # Add GOBIN to path
          GOPATH_VAL=$(go env GOPATH)
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            GOPATH_BIN=$(cygpath -u "$GOPATH_VAL")/bin
            export PATH="$GOPATH_BIN:$PATH"
            echo "$GOPATH_VAL\\bin" >> "$GITHUB_PATH"
          else
            export PATH="$GOPATH_VAL/bin:$PATH"
          fi

          ./scripts/ci/build_go.sh
          tar czf go-artifacts.tgz ./deployment
          echo "✅ Go build completed successfully"

      - name: 📂 Распаковка Go артефактов
        shell: bash
        run: |
          if [[ -f go-artifacts.tgz ]]; then
            tar xzf go-artifacts.tgz
            mkdir -p "download-artifact/NekoThrone-go-${{ matrix.cross_os }}-${{ matrix.cross_arch }}"
            cp go-artifacts.tgz "download-artifact/NekoThrone-go-${{ matrix.cross_os }}-${{ matrix.cross_arch }}/artifacts.tgz"
          else
            echo "ERROR: go-artifacts.tgz not found!"; exit 1
          fi

      - name: ⚙️ Установка MSVC
        if: matrix.os_label == 'windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\\Microsoft Visual Studio\\Installer\\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualCpp.Tools.HostX64.TargetX64 -property installationPath
          $vcvarsall = "$vsPath\\VC\\Auxiliary\\Build\\vcvarsall.bat"
          $lines = cmd /c "`"$vcvarsall`" x64 1>NUL && set"
          foreach ($line in $lines) {
            if ($line -match '^([^=]+)=(.*)$') {
              $n = $Matches[1]; $v = $Matches[2]
              if ($n -ieq 'PATH') {
                $v.Split(';') | Where-Object { $_ } | Add-Content $env:GITHUB_PATH
              } else {
                Add-Content $env:GITHUB_ENV "$n=$v"
              }
            }
          }

      - name: 📚 Установка Ninja (Windows)
        if: matrix.os_label == 'windows'
        run: choco install ninja -y

      - name: 🗂️ Кэш Qt (Linux)
        if: matrix.os_label == 'linux'
        id: cache-qt-linux
        uses: actions/cache@v5.0.3
        with:
          path: ~/Qt
          key: qt-linux-${{ env.QT_VERSION }}-v5

      - name: 🖼️ Установка Qt via aqt (Linux)
        if: matrix.os_label == 'linux' && steps.cache-qt-linux.outputs.cache-hit != 'true'
        run: |
          /opt/qt-ci-venv/bin/python -m aqt install-qt linux desktop ${{ env.QT_VERSION }} --outputdir ~/Qt

      - name: 🔧 Настройка окружения Qt (Linux)
        if: matrix.os_label == 'linux'
        run: |
          QT_ROOT="$HOME/Qt/${{ env.QT_VERSION }}/gcc_64"
          echo "CMAKE_PREFIX_PATH=$QT_ROOT" >> "$GITHUB_ENV"
          echo "$QT_ROOT/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$QT_ROOT/lib" >> "$GITHUB_ENV"

      - name: 🗂️ Кэш статического Qt (Windows)
        if: matrix.os_label == 'windows'
        id: cache-win-qt
        uses: actions/cache@v5.0.3
        with:
          path: qt6/build
          key: win-qt-static-${{ env.QT_VERSION }}-v5

      - name: 🔧 Сборка статического Qt (Windows)
        if: matrix.os_label == 'windows' && steps.cache-win-qt.outputs.cache-hit != 'true'
        shell: cmd
        run: call .\script\build_qt_static_windows.bat ${{ env.QT_VERSION }}

      - name: 🏗️ Сборка Neko Throne (Linux)
        if: matrix.os_label == 'linux'
        shell: bash
        run: |
          mkdir -p build && cd build
          curl -fLso srslist.h --retry 5 "https://raw.githubusercontent.com/throneproj/routeprofiles/rule-set/srslist.h" || touch srslist.h
          CMAKE_ARGS=(-GNinja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_EXE_LINKER_FLAGS="-static-libgcc -static-libstdc++")
          cmake "${CMAKE_ARGS[@]}" ..
          ninja -j$(nproc 2>/dev/null || echo 4)
          cd ..
          ./script/deploy_linux64.sh

      - name: 🏗️ Сборка Neko Throne (Windows)
        if: matrix.os_label == 'windows'
        shell: 'C:\Program Files\Git\bin\bash.EXE --noprofile --norc -eo pipefail {0}'
        run: |
          mkdir -p build && cd build
          curl -fLso srslist.h --retry 5 "https://raw.githubusercontent.com/throneproj/routeprofiles/rule-set/srslist.h" || touch srslist.h
          export CMAKE_PREFIX_PATH="$PWD/../qt6/build/lib/cmake"
          cmake -GNinja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl ..
          ninja -j${NUMBER_OF_PROCESSORS:-4}
          cd ..
          ./script/deploy_windows.sh

      - name: 📝 Итог сборки
        if: always()
        run: |
          echo "### 🏗️ Сборка завершена: ${{ matrix.os_label }}" >> $GITHUB_STEP_SUMMARY

      - name: 📤 Загрузка артефактов
        uses: actions/upload-artifact@v7.0.0
        with:
          name: NekoThrone-${{ matrix.os_label }}-amd64
          path: deployment/
          retention-days: 7

  # ─── Публикация релиза ────────────────────────────────────────────────────
  release:
    name: 🚀 Публикация релиза
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    needs: [build]
    permissions: { contents: write, actions: read }
    env:
      INPUT_VERSION: ${{ github.event.inputs.tag || format('0.0.0.1-nightly.{0}', github.run_number) }}
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/download-artifact@v8.0.1
        with: { path: download-artifact }
      - name: 📦 Упаковка и публикация
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/ci/release_pack.sh
      - name: 📝 Итог публикации
        if: always()
        run: |
          echo "### 🚀 Релиз: ${{ env.INPUT_VERSION }}" >> $GITHUB_STEP_SUMMARY
